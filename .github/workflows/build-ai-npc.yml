name: Build Shattered Pixel Dungeon ChatGPT AI NPC APK

on:
  push:
    branches:
      - build/shattered-chatgpt-ai-npc
    paths:
      - "ai-npc-patch.b64"
      - ".github/workflows/build-ai-npc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout the temporary build branch
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform 36
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0"
      - name: Retrieve upstream game source
        run: git clone --depth 1 https://github.com/00-Evan/shattered-pixel-dungeon.git spd
      - name: Apply AI NPC source patch
        run: |
          base64 -d ai-npc-patch.b64 > ai-npc-source.zip
          mkdir patch
          unzip -qq ai-npc-source.zip -d patch
          python3 patch/tools/apply_to_shattered.py spd
          python3 tools/add_starter_guide.py spd
      - name: Give v0.2 a distinct package name and app label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          android = Path("spd/android/build.gradle")
          a = android.read_text()
          old = 'applicationIdSuffix ".indev"'
          assert old in a
          android.write_text(a.replace(old, 'applicationIdSuffix ".ainpc02"', 1))
          base = Path("spd/build.gradle")
          b = base.read_text()
          old = "appName = 'Shattered Pixel Dungeon'"
          assert old in b
          base.write_text(b.replace(old, "appName = 'Shattered PD AI NPC v0.2'", 1))
          PY
      - name: Compile Android debug APK
        working-directory: spd
        run: |
          chmod +x ./gradlew
          ./gradlew :android:assembleDebug --no-daemon --stacktrace
      - name: Inspect output files
        if: success()
        run: find spd/android/build/outputs/apk -type f -name '*.apk' -print -exec sha256sum {} \;
      - name: Publish unsigned-for-release but debug-signed APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ShatteredPD-AI-NPC-Starter-Guide-v0.2-debug-APK
          path: spd/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
